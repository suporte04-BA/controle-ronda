<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Controle de Ronda</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card glass">
            <div class="login-header">
                <h1>Criar Conta</h1>
                <p>Preencha seus dados</p>
            </div>
            <form id="registroForm" class="login-form">
                <div class="form-group">
                    <label for="nomeCompleto">Nome Completo</label>
                    <input type="text" id="nomeCompleto" placeholder="Seu nome completo" required>
                </div>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" placeholder="Escolha um usuario" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Minimo 6 caracteres" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="senha2">Confirmar Senha</label>
                    <input type="password" id="senha2" placeholder="Repita a senha" required>
                </div>
                <div id="regError" class="error-message" style="display:none"></div>
                <div id="regSuccess" class="success-message" style="display:none"></div>
                <button type="submit" class="btn btn-primary btn-full" id="btnReg">Cadastrar</button>
            </form>
            <div class="login-footer">
                <a href="login.html">Ja tenho conta</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            const errDiv = document.getElementById('regError');
            const succDiv = document.getElementById('regSuccess');
            const senha = document.getElementById('senha').value;
            const senha2 = document.getElementById('senha2').value;
            if (senha !== senha2) { errDiv.textContent = 'Senhas nao conferem'; errDiv.style.display = 'block'; return; }
            btn.disabled = true; errDiv.style.display = 'none'; succDiv.style.display = 'none';
            try {
                const res = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nomeCompleto: document.getElementById('nomeCompleto').value,
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        senha: senha
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.erro || 'Erro ao cadastrar');
                succDiv.textContent = 'Conta criada com sucesso! Redirecionando...';
                succDiv.style.display = 'block';
                setTimeout(() => window.location.href = 'login.html', 2000);
            } catch (err) {
                errDiv.textContent = err.message;
                errDiv.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Cadastrar';
            }
        });
    </script>
</body>
</html>
